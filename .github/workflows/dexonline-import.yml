name: DEXonline import (manual)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate official DEXonline archive without database writes'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      smoke_import:
        description: 'Import up to 100 eligible definitions into staging tables (database writes)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      import_licensed_definitions:
        description: 'Run real licensed Source/Definition import (requires DATABASE_URL secret)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
concurrency:
  group: dexonline-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/python-fastapi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate execution mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          IMPORT: ${{ inputs.import_licensed_definitions }}
          SMOKE: ${{ inputs.smoke_import }}
        run: |
          if [ "$DRY_RUN" = 'false' ] && [ "$IMPORT" != 'true' ] && [ "$SMOKE" != 'true' ]; then
            echo 'Invalid mode: choose dry_run=true or import_licensed_definitions=true' >&2
            exit 1
          fi
      - name: Test SQL row parser
        run: python -m unittest discover -s scripts -p 'test_sql_parser.py' -v
      - name: Download official dump
        run: curl --fail --location --retry 4 --output /tmp/dex-database.sql.gz https://dexonline.ro/static/download/dex-database.sql.gz
      - name: Audit dictionary archive
        if: inputs.dry_run == 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEX_DUMP: /tmp/dex-database.sql.gz
        run: python scripts/import_dexonline.py
      - name: Preflight official schema and license metadata
        run: python scripts/preflight_dexonline.py
        env:
          DEX_DUMP: /tmp/dex-database.sql.gz
      - name: Parse bounded sample without database writes
        run: python scripts/sample_dexonline.py
        env:
          DEX_DUMP: /tmp/dex-database.sql.gz
          SAMPLE_LIMIT: '100'
      - name: Smoke import eligible definitions (max 100)
        if: inputs.smoke_import == 'true' && inputs.dry_run == 'false' && inputs.import_licensed_definitions == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEX_DUMP: /tmp/dex-database.sql.gz
          SMOKE_LIMIT: '100'
        run: python scripts/smoke_import.py
      - name: Audit full word candidates and ROGI (read-only)
        if: inputs.dry_run == 'true'
        env:
          DEX_DUMP: /tmp/dex-database.sql.gz
          TARGET_WORD: ROGI
        run: python scripts/audit_word_candidates.py
      - name: Import redistributable sources and definitions
        if: inputs.import_licensed_definitions == 'true' && inputs.dry_run == 'false' && inputs.smoke_import == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEX_DUMP: /tmp/dex-database.sql.gz
        run: python scripts/import_licensed_definitions.py
